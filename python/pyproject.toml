# The wheel of the `shapelogic` module (see README.md): the whole CMake
# project one folder up, configured for the module alone.
[build-system]
requires = ["scikit-build-core>=0.10"]
build-backend = "scikit_build_core.build"

[project]
name = "shapelogic"
# the project's version, from the git tag as CMake reads it
# (cmake/ProjectVersion.cmake): `just python-wheel` writes it to VERSION
# (git-ignored) before building; test_alpha.py checks they agree
dynamic = ["version"]
description = "Python bindings for the ShapeLogic 3D interlocking puzzle library (ShapeLogic's core)"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '^(?P<value>\d+\.\d+\.\d+)$'

[tool.scikit-build]
cmake.source-dir = ".."
cmake.build-type = "Release"
build.targets = ["shapelogic"]
install.components = ["python"]
wheel.packages = []
sdist.cmake = false

[tool.scikit-build.cmake.define]
BT_PYTHON = "ON"
BT_BUILD_TESTS = "OFF"

