# Staples Apple's notarisation tickets onto the macOS builds of one Release
# run (release.yml), once Apple has accepted them. Release only sends the
# .dmg to the notary service and finishes; this is the second half, run by
# hand when `xcrun notarytool info <id>` says Accepted:
#
#   gh workflow run staple.yml -f run_id=<the Release run's number>
#
# For each architecture it reads the run's notarisation-macos-<arch> record,
# checks that the run's .dmg is the file Apple was sent (its sha256 against
# Apple's log of the submission), staples the .dmg and the app inside the
# .zip, checks Gatekeeper accepts the app as notarised, and keeps the files
# as the macos-<arch>-notarised artifact. For a tag's run it also replaces
# the .dmg and .zip in that tag's draft Release.
#
# A submission still In Progress, or Invalid, fails the job with its status
# (and for Invalid, Apple's log); nothing is stapled. An architecture the run
# did not build (its box unticked) is skipped.

name: Staple

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The Release run whose macOS builds to staple (the number in its URL)'
        required: true
        type: string

permissions:
  actions: read # the run's artifacts
  contents: write # the tag's draft Release

jobs:
  staple:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Download the run's build and its notarisation record
        id: download
        run: |
          if ! [[ "${RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id is the number in the run's URL, not '${RUN_ID}'"
            exit 1
          fi
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --paginate --jq '.artifacts[].name')"
          if ! grep -qx "macos-${ARCH}" <<< "${artifacts}"; then
            echo "run ${RUN_ID} did not build macOS ${ARCH}: skipped" | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "built=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "built=true" >> "${GITHUB_OUTPUT}"
          gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" -n "macos-${ARCH}" -D build
          if ! gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" -n "notarisation-macos-${ARCH}" -D record; then
            echo "::error::run ${RUN_ID} has no notarisation record for ${ARCH}: it was not sent for notarisation (a manual run without Notarise ticked)"
            exit 1
          fi
          ls -l build record
      - name: Ask Apple, then staple
        if: steps.download.outputs.built == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          record="record/notarisation-${ARCH}.json"
          cat "${record}"
          id="$(jq -r .submission_id "${record}")"
          dmg="build/$(jq -r .file "${record}")"
          sha256="$(jq -r .sha256 "${record}")"
          if [ "$(shasum -a 256 "${dmg}" | cut -d' ' -f1)" != "${sha256}" ]; then
            echo "::error::${dmg} is not the file the run recorded sending to Apple"
            exit 1
          fi
          key_file="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "${APPLE_API_KEY_P8}" > "${key_file}"
          chmod 600 "${key_file}"
          auth=(--key "${key_file}" --key-id "${APPLE_API_KEY_ID}" --issuer "${APPLE_API_ISSUER}")
          info="$(xcrun notarytool info "${id}" "${auth[@]}" --output-format json)"
          echo "${info}"
          status="$(jq -r .status <<< "${info}")"
          case "${status}" in
            Accepted) ;;
            "In Progress")
              echo "::error::submission ${id} (${ARCH}, sent $(jq -r .createdDate <<< "${info}")) is still In Progress at Apple; run Staple again once it is Accepted"
              exit 1 ;;
            *)
              xcrun notarytool log "${id}" "${auth[@]}" || true
              echo "::error::submission ${id} (${ARCH}) is ${status}: Apple's log is above"
              exit 1 ;;
          esac
          # Apple's own record of what it was sent: the same bytes as this .dmg
          apple_sha256="$(xcrun notarytool log "${id}" "${auth[@]}" | jq -r .sha256)"
          rm -f "${key_file}"
          if [ "${apple_sha256}" != "${sha256}" ]; then
            echo "::error::Apple's log says submission ${id} was ${apple_sha256}, not this .dmg (${sha256})"
            exit 1
          fi

          xcrun stapler staple "${dmg}"
          xcrun stapler validate "${dmg}"
          mnt="$(mktemp -d)"
          hdiutil attach -nobrowse -readonly -mountpoint "${mnt}" "${dmg}"
          spctl -a -vv -t exec "${mnt}/ShapeLogic.app" 2>&1 | tee "${RUNNER_TEMP}/spctl.txt"
          hdiutil detach "${mnt}"
          if ! grep -q "Notarized Developer ID" "${RUNNER_TEMP}/spctl.txt"; then
            echo "::error::Gatekeeper does not take the app in ${dmg} as notarised"
            exit 1
          fi

          # the .zip holds the same app; staple it and zip it again as
          # electron-builder does (ditto, the app at the top)
          shopt -s nullglob
          for zip in build/*.zip; do
            unpacked="$(mktemp -d)"
            ditto -x -k "${zip}" "${unpacked}"
            xcrun stapler staple "${unpacked}/ShapeLogic.app"
            xcrun stapler validate "${unpacked}/ShapeLogic.app"
            rm "${zip}"
            ditto -c -k --sequesterRsrc --keepParent "${unpacked}/ShapeLogic.app" "${zip}"
          done
          (cd build && shasum -a 256 *.dmg *.zip) | tee -a "${GITHUB_STEP_SUMMARY}"
      - name: Remove the notarisation key
        if: always()
        run: rm -f "${RUNNER_TEMP}"/AuthKey_*.p8
      - uses: actions/upload-artifact@v4
        if: steps.download.outputs.built == 'true'
        with:
          name: macos-${{ matrix.arch }}-notarised
          if-no-files-found: error
          path: |
            build/*.dmg
            build/*.zip
      - name: Replace the files in the tag's draft Release
        if: steps.download.outputs.built == 'true'
        run: |
          read -r event ref < <(gh run view "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json event,headBranch --jq '"\(.event) \(.headBranch)"')
          if [ "${event}" != push ] || [[ "${ref}" != v* ]]; then
            echo "run ${RUN_ID} was not a tag's run (${event} on ${ref}): no Release to update"
            exit 0
          fi
          gh release upload "${ref}" build/*.dmg build/*.zip --repo "${GITHUB_REPOSITORY}" --clobber
