# The fallback for the Release workflow's macOS notarisation: Release waits
# up to an hour for Apple and staples the tickets itself, so this runs only
# when Apple took longer than that (the Release run's macOS jobs failed
# saying so). Run it by hand once `xcrun notarytool info <id>` says Accepted:
#
#   gh workflow run staple.yml -f run_id=<the Release run's number> -f tag=v1.4
#
# For each architecture it reads the run's notarisation-macos-<arch> record
# and staples the run's .dmg and .zip (.github/scripts/staple.sh: the same
# checks as Release's), keeping them as the macos-<arch>-notarised artifact.
# With a tag, it then attaches the release files to that tag's draft
# release (publish.yml): Linux and Windows from the Release run, macOS from
# this one. Without a tag it only staples.
#
# A submission still In Progress, or Invalid, fails the job with its status
# (and for Invalid, Apple's log); nothing is stapled. An architecture the run
# did not build (its box unticked) is skipped.

name: Staple

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The Release run whose macOS builds to staple (the number in its URL)'
        required: true
        type: string
      tag:
        description: 'Then attach the files to this tag''s draft release (vX.Y; empty: only staple)'
        required: false
        type: string

permissions:
  actions: read # the run's artifacts
  contents: read

jobs:
  staple:
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      GH_TOKEN: ${{ github.token }}
      RUN_ID: ${{ inputs.run_id }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the run's build and its notarisation record
        id: download
        run: |
          if ! [[ "${RUN_ID}" =~ ^[0-9]+$ ]]; then
            echo "::error::run_id is the number in the run's URL, not '${RUN_ID}'"
            exit 1
          fi
          artifacts="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" --paginate --jq '.artifacts[].name')"
          if ! grep -qx "macos-${ARCH}" <<< "${artifacts}"; then
            echo "run ${RUN_ID} did not build macOS ${ARCH}: skipped" | tee -a "${GITHUB_STEP_SUMMARY}"
            echo "built=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo "built=true" >> "${GITHUB_OUTPUT}"
          gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" -n "macos-${ARCH}" -D build
          if ! gh run download "${RUN_ID}" --repo "${GITHUB_REPOSITORY}" -n "notarisation-macos-${ARCH}" -D record; then
            echo "::error::run ${RUN_ID} has no notarisation record for ${ARCH}: it was not sent for notarisation (a manual run without Notarise ticked)"
            exit 1
          fi
          ls -l build record
      - name: Ask Apple, then staple
        if: steps.download.outputs.built == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash .github/scripts/staple.sh "record/notarisation-${ARCH}.json" build
      - uses: actions/upload-artifact@v4
        if: steps.download.outputs.built == 'true'
        with:
          name: macos-${{ matrix.arch }}-notarised
          if-no-files-found: error
          path: |
            build/*.dmg
            build/*.zip

  # the release files on the tag's draft: Linux and Windows from the Release
  # run, macOS (stapled) from this run
  publish:
    needs: staple
    if: inputs.tag != ''
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      run_id: ${{ inputs.run_id }}
      mac_run_id: ${{ github.run_id }}
      tag: ${{ inputs.tag }}
