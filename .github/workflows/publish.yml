# Attaches a Release run's installers to the tag's DRAFT GitHub release,
# renamed as the release page lists them (.github/scripts/prepare-release.py:
# ShapeLogic-v1.4-linux-x64.deb and so on, nine files). The Release
# workflow calls it at the end of a run on a tag; the Staple workflow calls
# it after stapling when Apple was slow. By hand, for a run whose files are
# all there:
#
#   gh workflow run publish.yml -f run_id=<the Release run's number> -f tag=v1.4
#
# `just release` (.github/scripts/release.sh) makes the draft with its
# notes before the build; this only uploads the files to it, replacing any
# of the same name, and leaves the notes alone. When there is no release
# for the tag (the tag was pushed without `just release`), it makes the
# draft with only the "Which file to download" tables as notes. A release
# already published is never touched: publishing stays a person's click.

name: Publish

on:
  workflow_call:
    inputs:
      run_id:
        description: 'The Release run that built the installers'
        required: true
        type: string
      mac_run_id:
        description: 'The run that holds the macos-*-notarised artifacts (default: run_id)'
        required: false
        type: string
        default: ''
      tag:
        description: 'The release tag (vX.Y)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      run_id:
        description: 'The Release run that built the installers (the number in its URL)'
        required: true
        type: string
      mac_run_id:
        description: 'The run that holds the macos-*-notarised artifacts, when a Staple run made them (empty: run_id)'
        required: false
        type: string
        default: ''
      tag:
        description: 'The release tag (vX.Y)'
        required: true
        type: string

permissions:
  actions: read # the runs' artifacts
  contents: write # the draft release

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag and its release
        id: release
        run: |
          if ! [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "::error::tag is vX.Y or vX.Y.Z, not '${TAG}'"
            exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/${TAG}" > /dev/null; then
            echo "::error::there is no tag ${TAG} on GitHub"
            exit 1
          fi
          draft="$(gh release view "${TAG}" --json isDraft --jq .isDraft 2> /dev/null || echo none)"
          case "${draft}" in
            true) echo "state=draft" >> "${GITHUB_OUTPUT}" ;;
            none) echo "state=none" >> "${GITHUB_OUTPUT}" ;;
            *)
              echo "::error::release ${TAG} is already published: its files are not replaced"
              exit 1 ;;
          esac
      - name: Download Linux and Windows
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: '{linux-*,windows-x64}'
          path: artifacts
      - name: Download macOS, stapled
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.mac_run_id != '' && inputs.mac_run_id || inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: 'macos-*-notarised'
          path: artifacts
      - name: Rename the installers
        run: |
          ls -R artifacts
          python3 .github/scripts/prepare-release.py artifacts "${TAG}" --out out
          count="$(find out -type f | wc -l)"
          if [ "${count}" -ne 9 ]; then
            echo "::error::expected 9 release files, made ${count}"
            exit 1
          fi
      - name: Attach them to the draft release
        env:
          STATE: ${{ steps.release.outputs.state }}
        run: |
          if [ "${STATE}" = none ]; then
            sed "s/{version}/${TAG}/g" .github/scripts/release-downloads.md > "${RUNNER_TEMP}/notes.md"
            gh release create "${TAG}" --draft --verify-tag --title "ShapeLogic ${TAG}" \
              --notes-file "${RUNNER_TEMP}/notes.md" out/*
            echo "::warning::release ${TAG} had no draft: made one whose notes are only the download tables; add the What's new before publishing"
          else
            gh release upload "${TAG}" out/* --clobber
          fi
          url="$(gh release view "${TAG}" --json url --jq .url)"
          {
            echo "### Draft release ${TAG}"
            echo
            echo "The nine files are attached. Review it, then **Publish**: ${url}"
            echo
            echo '```'
            (cd out && sha256sum ./*)
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
