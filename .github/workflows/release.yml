# Builds ShapeLogic for Linux, Windows and macOS (Apple silicon and Intel),
# notarises and staples the macOS builds, and, on a release tag, attaches
# the installers to the tag's draft GitHub release.
#
# A release (the steps: `just release` with no argument prints them):
#   1. The notes, by AI, in release/notes/vX.Y.md (git-ignored, local only).
#   2. `just release vX.Y` (.github/scripts/release.sh): checks, pushes the
#      tag vX.Y, which starts this workflow, and makes the draft release
#      with the notes.
#   3. This run builds every platform with notarisation, waits for Apple
#      (up to an hour), staples, and the publish job (publish.yml) attaches
#      the nine renamed files to the draft. A person reviews it and clicks
#      Publish.
# A patch (`just release vX.Y.Z`, Z > 0) runs the same way; publishing its
# draft makes the Patch workflow (patch.yml) fold it into the published
# vX.Y release, which moves to the new tag with the new files and notes.
# The version is the tag's (vX.Y is X.Y.0, cmake/ProjectVersion.cmake): the
# version job gives it to every build as SHAPELOGIC_VERSION.
#
# By hand (Actions tab > Release > Run workflow, or `gh workflow run
# release.yml`) it makes test builds of a branch, as workflow artifacts
# only, with the newest tag's version: untick a platform's box to leave it
# out, tick "Notarise" to notarise. A run by hand on a tag with every box
# ticked publishes as a tag push does.
#
# When Apple takes longer than the wait, the macOS jobs fail saying so;
# once `xcrun notarytool info <id>` says Accepted, the Staple workflow
# (staple.yml) staples that run's builds and, given the tag, publishes.
#
# The macOS builds are signed with the Developer ID certificate and sent for
# notarisation with these repository secrets (staple.yml uses the APPLE_API_* ones too):
#   MACOS_CERT_P12_BASE64  the .p12 (certificate and private key), base64
#   MACOS_CERT_PASSWORD    the .p12's password
#   APPLE_API_KEY_P8       the text of the App Store Connect AuthKey_XXXX.p8
#   APPLE_API_KEY_ID       that key's id
#   APPLE_API_ISSUER       the issuer id
# Windows and Linux are not signed (docs/handoff/web-8.md).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      linux_x64:
        description: 'Linux x64 (AppImage and deb)'
        type: boolean
        default: true
      linux_arm64:
        description: 'Linux arm64 (AppImage and deb)'
        type: boolean
        default: true
      windows_x64:
        description: 'Windows x64 (installer)'
        type: boolean
        default: true
      macos_arm64:
        description: 'macOS Apple silicon (dmg and zip)'
        type: boolean
        default: true
      macos_x64:
        description: 'macOS Intel (dmg and zip)'
        type: boolean
        default: true
      notarise:
        description: 'Also send the macOS builds for notarisation'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  # The version (the tag's, or on a branch the newest tag's), whether the
  # run publishes, and the run's boxes as the build jobs' matrices (a tag
  # push: every box, and notarise).
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      notarise: ${{ steps.version.outputs.notarise }}
      linux: ${{ steps.platforms.outputs.linux }}
      macos: ${{ steps.platforms.outputs.macos }}
      windows: ${{ steps.platforms.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the tags, for a branch's version
      - name: The version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          ALL_BOXES: ${{ inputs.linux_x64 && inputs.linux_arm64 && inputs.windows_x64 && inputs.macos_arm64 && inputs.macos_x64 && inputs.notarise }}
          NOTARISE: ${{ inputs.notarise }}
        run: |
          if [ "${REF_TYPE}" = tag ]; then
            if ! [[ "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::tag ${REF_NAME} is not vX.Y or vX.Y.Z: not a release tag"
              exit 1
            fi
            tag="${REF_NAME}"
            if [ "${EVENT}" = push ] || [ "${ALL_BOXES}" = true ]; then
              publish=true
            else
              publish=false
              echo "::warning::a run by hand on ${tag} without every box ticked: built, not published"
            fi
          else
            tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 2> /dev/null || echo v0.0)"
            publish=false
            echo "::warning::a build of ${REF_NAME}, not a release tag: it says the newest tag's version (${tag}) and is not published"
          fi
          notarise=false
          if [ "${EVENT}" = push ] || [ "${NOTARISE}" = true ]; then
            notarise=true
          fi
          {
            echo "version=${tag}"
            echo "publish=${publish}"
            echo "notarise=${notarise}"
          } | tee -a "${GITHUB_OUTPUT}"
      - name: The platforms to build
        id: platforms
        env:
          EVENT: ${{ github.event_name }}
          LINUX_X64: ${{ inputs.linux_x64 }}
          LINUX_ARM64: ${{ inputs.linux_arm64 }}
          WINDOWS_X64: ${{ inputs.windows_x64 }}
          MACOS_ARM64: ${{ inputs.macos_arm64 }}
          MACOS_X64: ${{ inputs.macos_x64 }}
        run: |
          # a tag push has no boxes: it builds everything
          on() { [ "${EVENT}" = push ] || [ "$1" = true ]; }
          linux='[]'
          on "${LINUX_X64}" && linux=$(jq -c '. + [{arch: "x64", runner: "ubuntu-24.04"}]' <<< "${linux}")
          on "${LINUX_ARM64}" && linux=$(jq -c '. + [{arch: "arm64", runner: "ubuntu-24.04-arm"}]' <<< "${linux}")
          macos='[]'
          on "${MACOS_ARM64}" && macos=$(jq -c '. + [{arch: "arm64", preset: "release", dist_dir: "mac-arm64"}]' <<< "${macos}")
          on "${MACOS_X64}" && macos=$(jq -c '. + [{arch: "x64", preset: "release-x64", dist_dir: "mac"}]' <<< "${macos}")
          windows=false
          on "${WINDOWS_X64}" && windows=true
          {
            echo "linux=${linux}"
            echo "macos=${macos}"
            echo "windows=${windows}"
          } | tee -a "${GITHUB_OUTPUT}"
          if [ "${linux}" = '[]' ] && [ "${macos}" = '[]' ] && [ "${windows}" = false ]; then
            echo "::error::no platform ticked: nothing to build"
            exit 1
          fi

  linux:
    needs: version
    if: needs.version.outputs.linux != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SHAPELOGIC_VERSION: ${{ needs.version.outputs.version }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.linux) }}
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev xvfb
      # electron-builder's bundled fpm (it makes the .deb) is x86-64 only
      - name: System fpm (arm64 only)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "${GITHUB_ENV}"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      # GCC (Linux, MinGW) warns where clang does not (docs: the project's -Werror
      # was only ever run with clang), so these two builds keep the warnings
      # in the log but do not fail on them.
      - name: Build the engine
        run: |
          cmake --preset release -DBT_WERROR=OFF
          cmake --build --preset release
      - name: Unit tests (x64 is a real x86-64 machine, so the AVX2 kernels run)
        continue-on-error: true # failures show in the log but do not stop the installers
        run: ctest --preset release -LE slow
      - name: Install the front end's packages
        run: npm ci
        working-directory: web
      - name: Package (AppImage and deb)
        run: npm run dist
        working-directory: web
      - name: Check both installers were made
        working-directory: web
        run: |
          ls -l dist
          ls dist/*.AppImage dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            web/dist/*.AppImage
            web/dist/*.deb

  windows:
    needs: version
    if: needs.version.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      SHAPELOGIC_VERSION: ${{ needs.version.outputs.version }}
    steps:
      # the recorded files the tests compare with are LF: no CRLF conversion
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the engine
        shell: msys2 {0}
        run: |
          cmake --preset release -DBT_WERROR=OFF
          cmake --build --preset release
      - name: Unit tests (a real x86-64 machine, so the AVX2 kernels run)
        continue-on-error: true # failures show in the log but do not stop the installers
        shell: msys2 {0}
        run: ctest --preset release -LE slow
      - name: Install the front end's packages
        run: npm ci
        working-directory: web
      - name: Package (NSIS installer, unsigned)
        run: npm run dist
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: web/dist/*.exe

  macos:
    needs: version
    if: needs.version.outputs.macos != '[]'
    runs-on: macos-latest # Apple silicon
    timeout-minutes: 150 # the build, and up to an hour waiting for Apple
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.version.outputs.macos) }}
    env:
      SHAPELOGIC_VERSION: ${{ needs.version.outputs.version }}
      # whether to send the .dmg to Apple's notary service, wait and staple
      NOTARISE: ${{ needs.version.outputs.notarise }}
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install ninja
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the engine (${{ matrix.arch }})
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
      - name: Unit tests (Apple silicon only, the Intel engine cannot run natively here)
        continue-on-error: true # failures show in the log but do not stop the installers
        if: matrix.arch == 'arm64'
        run: ctest --preset release -LE slow
      - name: Install the front end's packages
        run: npm ci
        working-directory: web
      # electron-builder's own import of CSC_LINK fails on this runner (it unlocks
      # its temporary keychain with the .p12's password, not the keychain's), so
      # the certificate goes into a keychain here and dist.ts is given CSC_NAME.
      - name: Import the Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "${MACOS_CERT_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          curl -fsSL -o "${RUNNER_TEMP}/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${RUNNER_TEMP}/DeveloperIDG2CA.cer" -k "${keychain}"
          security import "${RUNNER_TEMP}/cert.p12" -k "${keychain}" -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          rm -f "${RUNNER_TEMP}/cert.p12"
          security find-identity -v -p codesigning "${keychain}"
          echo "CSC_NAME=$(security find-identity -v -p codesigning "${keychain}" | sed -nE 's/.*"Developer ID Application: ([^"]+)".*/\1/p' | head -1)" >> "${GITHUB_ENV}"
      # electron-builder only signs here: it notarises when the APPLE_API_*
      # variables are set, and none are, so no step waits on Apple's queue.
      - name: Package and sign (${{ matrix.arch }})
        timeout-minutes: 30
        run: npm run dist -- --arch ${{ matrix.arch }}
        working-directory: web
      - name: Check the signature
        working-directory: web
        run: codesign --verify --deep --strict --verbose=2 "dist/${{ matrix.dist_dir }}/ShapeLogic.app"
      # Kept before notarising, so a failed submission cannot lose the signed build.
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            web/dist/*.dmg
            web/dist/*.zip
      # Sends the disk image and records the submission, then (the next steps)
      # waits for Apple and staples. Notarising the .dmg covers the app inside
      # it, the same signed app as the .zip's. The record is kept as an
      # artifact, so the Staple workflow can finish when Apple is slower than
      # the wait.
      - name: Submit the disk image for notarisation
        if: env.NOTARISE == 'true'
        working-directory: web
        timeout-minutes: 15 # the upload only
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::expected one disk image in web/dist, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"
          key_file="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "${APPLE_API_KEY_P8}" > "${key_file}"
          chmod 600 "${key_file}"
          # sent under a name that says which run and architecture it is from, as
          # `notarytool history` shows it; the bytes are the artifact's, so the
          # ticket staples onto the artifact's .dmg
          version="${SHAPELOGIC_VERSION}"
          submitted_as="ShapeLogic-${version}-${ARCH}-run${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.dmg"
          cp "${dmg}" "${RUNNER_TEMP}/${submitted_as}"
          xcrun notarytool submit "${RUNNER_TEMP}/${submitted_as}" \
            --key "${key_file}" --key-id "${APPLE_API_KEY_ID}" --issuer "${APPLE_API_ISSUER}" \
            --output-format json > "${RUNNER_TEMP}/submit.json"
          rm -f "${key_file}"
          id="$(jq -r '.id // empty' "${RUNNER_TEMP}/submit.json")"
          if [ -z "${id}" ]; then
            cat "${RUNNER_TEMP}/submit.json"
            echo "::error::notarytool gave no submission id"
            exit 1
          fi
          # the record the Staple workflow reads; Apple's log of the submission
          # gives the same sha256 once it is done
          jq -n \
            --arg submission_id "${id}" --arg submitted_as "${submitted_as}" \
            --arg file "$(basename "${dmg}")" --arg sha256 "$(shasum -a 256 "${dmg}" | cut -d' ' -f1)" \
            --arg arch "${ARCH}" --arg version "${version}" \
            --arg run_id "${GITHUB_RUN_ID}" --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg ref "${GITHUB_REF_NAME}" --arg commit "${GITHUB_SHA}" \
            '$ARGS.named' > "dist/notarisation-${ARCH}.json"
          cat "dist/notarisation-${ARCH}.json"
          {
            echo "### macOS ${ARCH}: sent for notarisation"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Submission | \`${id}\` |"
            echo "| Sent as | \`${submitted_as}\` |"
            echo "| Artifact file | \`$(basename "${dmg}")\` in \`macos-${ARCH}\` |"
            echo
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        if: env.NOTARISE == 'true'
        with:
          name: notarisation-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: web/dist/notarisation-*.json
      - name: Wait for Apple (up to an hour)
        if: env.NOTARISE == 'true'
        working-directory: web
        timeout-minutes: 65
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ARCH: ${{ matrix.arch }}
          TAG: ${{ needs.version.outputs.version }}
        run: |
          id="$(jq -r .submission_id "dist/notarisation-${ARCH}.json")"
          key_file="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "${APPLE_API_KEY_P8}" > "${key_file}"
          chmod 600 "${key_file}"
          if ! xcrun notarytool wait "${id}" --timeout 60m \
            --key "${key_file}" --key-id "${APPLE_API_KEY_ID}" --issuer "${APPLE_API_ISSUER}"; then
            rm -f "${key_file}"
            {
              echo "### macOS ${ARCH}: Apple has not finished"
              echo
              echo "Once \`xcrun notarytool info ${id} …\` says **Accepted**, staple and publish with:"
              echo "\`gh workflow run staple.yml -f run_id=${GITHUB_RUN_ID} -f tag=${TAG}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            echo "::error::submission ${id} (${ARCH}) is not done after the wait: run Staple once Apple has accepted it (the summary has the command)"
            exit 1
          fi
          rm -f "${key_file}"
      # the checks and the stapling the Staple workflow does too
      - name: Staple
        if: env.NOTARISE == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ARCH: ${{ matrix.arch }}
        run: bash .github/scripts/staple.sh "web/dist/notarisation-${ARCH}.json" web/dist
      - uses: actions/upload-artifact@v4
        if: env.NOTARISE == 'true'
        with:
          name: macos-${{ matrix.arch }}-notarised
          if-no-files-found: error
          path: |
            web/dist/*.dmg
            web/dist/*.zip
      - name: Remove the keychain and the notarisation key
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true
          rm -f "${RUNNER_TEMP}"/AuthKey_*.p8

  # On a release tag: the nine renamed files onto the tag's draft release
  # (publish.yml), once every build is done and stapled.
  publish:
    needs: [version, linux, windows, macos]
    if: needs.version.outputs.publish == 'true'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/publish.yml
    with:
      run_id: ${{ github.run_id }}
      tag: ${{ needs.version.outputs.version }}
