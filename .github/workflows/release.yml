# Builds ShapeLogic for Linux, Windows and macOS (Apple silicon and Intel) and
# attaches the installers to a draft GitHub Release.
#
# Runs only when asked: a push to main does not start it.
# - By hand (Actions tab > Release > Run workflow, or `gh workflow run
#   release.yml`): builds and keeps the files as workflow artifacts; the macOS
#   builds are signed but not notarised (tick "Notarise" to notarise), and no
#   Release is made.
# - Pushing a version tag (`git tag v0.1.0 && git push origin v0.1.0`):
#   builds, sends the macOS builds for notarisation and drafts a Release.
#
# No run waits for Apple: the macOS jobs send the signed .dmg to the notary
# service and finish. The job summary and the notarisation-macos-<arch>
# artifact give the submission id. Once `xcrun notarytool info <id>` says
# Accepted, the Staple workflow (staple.yml) staples the tickets onto that
# run's .dmg and .zip and, for a tag's run, replaces them in the Release.
#
# The macOS builds are signed with the Developer ID certificate and sent for
# notarisation with these repository secrets (staple.yml uses the APPLE_API_* ones too):
#   MACOS_CERT_P12_BASE64  the .p12 (certificate and private key), base64
#   MACOS_CERT_PASSWORD    the .p12's password
#   APPLE_API_KEY_P8       the text of the App Store Connect AuthKey_XXXX.p8
#   APPLE_API_KEY_ID       that key's id
#   APPLE_API_ISSUER       the issuer id
# Windows and Linux are not signed (docs/handoff/web-8.md).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      notarise:
        description: 'Also send the macOS builds for notarisation (a tag push always does)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  # The tag must be the project's version (CMakeLists.txt, web/package.json),
  # or the packaged files would carry a different number from the Release's.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cmake_version=$(sed -nE 's/.*project\(.* VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt | head -1)
          pkg_version=$(node -p "require('./web/package.json').version")
          echo "tag ${GITHUB_REF_NAME}, CMakeLists.txt ${cmake_version}, web/package.json ${pkg_version}"
          test "${GITHUB_REF_NAME}" = "v${cmake_version}"
          test "${cmake_version}" = "${pkg_version}"

  linux:
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build zlib1g-dev xvfb
      # electron-builder's bundled fpm (it makes the .deb) is x86-64 only
      - name: System fpm (arm64 only)
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y ruby ruby-dev build-essential
          sudo gem install --no-document fpm
          echo "USE_SYSTEM_FPM=true" >> "${GITHUB_ENV}"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      # GCC (Linux, MinGW) warns where clang does not (docs: the project's -Werror
      # was only ever run with clang), so these two builds keep the warnings
      # in the log but do not fail on them.
      - name: Build the engine
        run: |
          cmake --preset release -DBT_WERROR=OFF
          cmake --build --preset release
      - name: Unit tests (x64 is a real x86-64 machine, so the AVX2 kernels run)
        continue-on-error: true # failures show in the log but do not stop the installers
        run: ctest --preset release -LE slow
      - name: Install the front end's packages
        run: npm ci
        working-directory: web
      - name: Package (AppImage and deb)
        run: npm run dist
        working-directory: web
      - name: Check both installers were made
        working-directory: web
        run: |
          ls -l dist
          ls dist/*.AppImage dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            web/dist/*.AppImage
            web/dist/*.deb

  windows:
    needs: version
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      # the recorded files the tests compare with are LF: no CRLF conversion
      - name: Check out with LF line endings
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - name: MinGW-w64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-python
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the engine
        shell: msys2 {0}
        run: |
          cmake --preset release -DBT_WERROR=OFF
          cmake --build --preset release
      - name: Unit tests (a real x86-64 machine, so the AVX2 kernels run)
        continue-on-error: true # failures show in the log but do not stop the installers
        shell: msys2 {0}
        run: ctest --preset release -LE slow
      - name: Install the front end's packages
        run: npm ci
        working-directory: web
      - name: Package (NSIS installer, unsigned)
        run: npm run dist
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          if-no-files-found: error
          path: web/dist/*.exe

  macos:
    needs: version
    runs-on: macos-latest # Apple silicon
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            preset: release
            dist_dir: mac-arm64
          - arch: x64
            preset: release-x64
            dist_dir: mac
    env:
      # whether to send the .dmg to Apple's notary service (a manual run asks)
      NOTARISE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.notarise }}
    steps:
      - uses: actions/checkout@v4
      - name: Build tools
        run: brew install ninja
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the engine (${{ matrix.arch }})
        run: |
          cmake --preset ${{ matrix.preset }}
          cmake --build --preset ${{ matrix.preset }}
      - name: Unit tests (Apple silicon only, the Intel engine cannot run natively here)
        continue-on-error: true # failures show in the log but do not stop the installers
        if: matrix.arch == 'arm64'
        run: ctest --preset release -LE slow
      - name: Install the front end's packages
        run: npm ci
        working-directory: web
      # electron-builder's own import of CSC_LINK fails on this runner (it unlocks
      # its temporary keychain with the .p12's password, not the keychain's), so
      # the certificate goes into a keychain here and dist.ts is given CSC_NAME.
      - name: Import the Developer ID certificate
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          keychain="${RUNNER_TEMP}/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "${MACOS_CERT_P12_BASE64}" | base64 --decode > "${RUNNER_TEMP}/cert.p12"
          curl -fsSL -o "${RUNNER_TEMP}/DeveloperIDG2CA.cer" https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer
          security create-keychain -p "${keychain_password}" "${keychain}"
          security set-keychain-settings -lut 21600 "${keychain}"
          security unlock-keychain -p "${keychain_password}" "${keychain}"
          security import "${RUNNER_TEMP}/DeveloperIDG2CA.cer" -k "${keychain}"
          security import "${RUNNER_TEMP}/cert.p12" -k "${keychain}" -P "${MACOS_CERT_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "${keychain_password}" "${keychain}" > /dev/null
          security list-keychains -d user -s "${keychain}" $(security list-keychains -d user | tr -d '"')
          rm -f "${RUNNER_TEMP}/cert.p12"
          security find-identity -v -p codesigning "${keychain}"
          echo "CSC_NAME=$(security find-identity -v -p codesigning "${keychain}" | sed -nE 's/.*"Developer ID Application: ([^"]+)".*/\1/p' | head -1)" >> "${GITHUB_ENV}"
      # electron-builder only signs here: it notarises when the APPLE_API_*
      # variables are set, and none are, so no step waits on Apple's queue.
      - name: Package and sign (${{ matrix.arch }})
        timeout-minutes: 30
        run: npm run dist -- --arch ${{ matrix.arch }}
        working-directory: web
      - name: Check the signature
        working-directory: web
        run: codesign --verify --deep --strict --verbose=2 "dist/${{ matrix.dist_dir }}/ShapeLogic.app"
      # Kept before notarising, so a failed submission cannot lose the signed build.
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            web/dist/*.dmg
            web/dist/*.zip
      # Apple's queue takes minutes or days, so the run only uploads the disk
      # image and records the submission; the Staple workflow (staple.yml)
      # staples it once Apple has accepted it. Notarising the .dmg covers the
      # app inside it, the same signed app as the .zip's.
      - name: Submit the disk image for notarisation (not waiting for Apple)
        if: env.NOTARISE == 'true'
        working-directory: web
        timeout-minutes: 15 # the upload only
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          dmgs=(dist/*.dmg)
          if [ "${#dmgs[@]}" -ne 1 ]; then
            echo "::error::expected one disk image in web/dist, found ${#dmgs[@]}"
            exit 1
          fi
          dmg="${dmgs[0]}"
          key_file="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s\n' "${APPLE_API_KEY_P8}" > "${key_file}"
          chmod 600 "${key_file}"
          # sent under a name that says which run and architecture it is from, as
          # `notarytool history` shows it; the bytes are the artifact's, so the
          # ticket staples onto the artifact's .dmg
          version="$(node -p "require('./package.json').version")"
          submitted_as="ShapeLogic-${version}-${ARCH}-run${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.dmg"
          cp "${dmg}" "${RUNNER_TEMP}/${submitted_as}"
          xcrun notarytool submit "${RUNNER_TEMP}/${submitted_as}" \
            --key "${key_file}" --key-id "${APPLE_API_KEY_ID}" --issuer "${APPLE_API_ISSUER}" \
            --output-format json > "${RUNNER_TEMP}/submit.json"
          rm -f "${key_file}"
          id="$(jq -r '.id // empty' "${RUNNER_TEMP}/submit.json")"
          if [ -z "${id}" ]; then
            cat "${RUNNER_TEMP}/submit.json"
            echo "::error::notarytool gave no submission id"
            exit 1
          fi
          # the record the Staple workflow reads; Apple's log of the submission
          # gives the same sha256 once it is done
          jq -n \
            --arg submission_id "${id}" --arg submitted_as "${submitted_as}" \
            --arg file "$(basename "${dmg}")" --arg sha256 "$(shasum -a 256 "${dmg}" | cut -d' ' -f1)" \
            --arg arch "${ARCH}" --arg version "${version}" \
            --arg run_id "${GITHUB_RUN_ID}" --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg ref "${GITHUB_REF_NAME}" --arg commit "${GITHUB_SHA}" \
            '$ARGS.named' > "dist/notarisation-${ARCH}.json"
          cat "dist/notarisation-${ARCH}.json"
          {
            echo "### macOS ${ARCH}: sent for notarisation"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Submission | \`${id}\` |"
            echo "| Sent as | \`${submitted_as}\` |"
            echo "| Artifact file | \`$(basename "${dmg}")\` in \`macos-${ARCH}\` |"
            echo
            echo "Status: \`xcrun notarytool info ${id} …\`. Once it is **Accepted**, staple it:"
            echo "\`gh workflow run staple.yml -f run_id=${GITHUB_RUN_ID}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
      - uses: actions/upload-artifact@v4
        if: env.NOTARISE == 'true'
        with:
          name: notarisation-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: web/dist/notarisation-*.json
      - name: Remove the keychain and the notarisation key
        if: always()
        run: |
          security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true
          rm -f "${RUNNER_TEMP}"/AuthKey_*.p8

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Draft the Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # the notarisation records are for the Staple workflow, not the Release
          rm -f artifacts/notarisation-*.json
          ls -l artifacts
          gh release create "${GITHUB_REF_NAME}" artifacts/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "ShapeLogic ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --draft
